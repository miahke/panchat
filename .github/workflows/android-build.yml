name: panchat checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Verify committed native inputs
        run: tools/arti-build/verify-checksums.sh
      - name: Application and watch tests
        run: ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest --max-workers=2
      - name: UI tests
        run: >-
          ./gradlew :app:testDebugUnitTest -PnetworkUiTests=true --max-workers=2
          --tests '*NetworkWorkspaceButtonsTest' --tests '*NetworkWorkspaceVisualTest'
          --tests '*QwdttAdminScreenTest' --tests '*Panchat*Test'
      - name: Installer and package checks
        run: |
          python3 -m unittest discover -s deploy/tests
          python3 -m unittest discover -s tools/network-native/tests
      - name: Go tests
        env:
          GOTOOLCHAIN: go1.27.3
          GOMAXPROCS: '2'
        run: |
          go -C native/qwdtt test -p=2 ./...
          go -C server/qwdtt test -race -p=2 ./server
      - name: Build and verify unsigned APKs
        run: |
          ./gradlew :app:assembleRelease --max-workers=2
          python3 tools/network-native/verify-package.py app/build/outputs/apk/release/app-universal-release-unsigned.apk
